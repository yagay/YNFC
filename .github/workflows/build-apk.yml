name: Build and Verify YNFC Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify package namespace migration
        run: |
          set -euo pipefail
          LEGACY='com.yagay.'"nfcdoorcard"
          LEGACY_PATH='com/yagay/'"nfcdoorcard"
          if git grep -nF "$LEGACY" -- . ':(exclude).github/workflows/build-apk.yml'; then
            echo "Legacy package identity remains in tracked files" >&2
            exit 1
          fi
          if find feature/src -path "*$LEGACY_PATH*" -print -quit | grep -q .; then
            echo "Legacy package directory remains" >&2
            exit 1
          fi
          test -d feature/src/main/java/com/yagay/YNFC
          test -d feature/src/test/java/com/yagay/YNFC
          grep -Fq 'namespace = "com.yagay.YNFC"' feature/build.gradle.kts
          grep -Fq 'applicationId = "com.yagay.YNFC"' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, arm64-v8a debug build and lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            -PciArm64Only=true \
            :feature:testDebugUnitTest \
            :app:assembleDebug \
            :app:lintDebug \
            --stacktrace

      - name: Verify APK files and Xposed metadata
        run: |
          set -euo pipefail
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          EXPECTED_VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' app/build.gradle.kts)
          EXPECTED_VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"$/\1/p' app/build.gradle.kts)
          test -n "$EXPECTED_VERSION_CODE"
          test -n "$EXPECTED_VERSION_NAME"
          test -f "$DEBUG_APK"

          DEBUG_ABIS="$(unzip -Z1 "$DEBUG_APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          if [ -n "$DEBUG_ABIS" ] && [ "$DEBUG_ABIS" != "arm64-v8a" ]; then
            echo "Unexpected debug ABIs: $DEBUG_ABIS" >&2
            exit 1
          fi

          for apk in "$DEBUG_APK"; do
            CONTENTS=$(unzip -Z1 "$apk")
            grep -Fxq 'META-INF/xposed/java_init.list' <<< "$CONTENTS"
            grep -Fxq 'META-INF/xposed/module.prop' <<< "$CONTENTS"
            grep -Fxq 'META-INF/xposed/scope.list' <<< "$CONTENTS"
            test "$(unzip -p "$apk" META-INF/xposed/java_init.list)" = 'com.yagay.YNFC.xposed.NfcInjectionModule'
            test "$(unzip -p "$apk" META-INF/xposed/scope.list)" = 'com.android.nfc'
            BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk")
            grep -Fq "package: name='com.yagay.YNFC'" <<< "$BADGING"
            grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" <<< "$BADGING"
            grep -Fq "versionName='$EXPECTED_VERSION_NAME'" <<< "$BADGING"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p 4 "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Prepare fixed debug APK name
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/YNFC-debug-arm64-v8a.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YNFC-debug-arm64-v8a
          path: artifacts/YNFC-debug-arm64-v8a.apk
          if-no-files-found: error

